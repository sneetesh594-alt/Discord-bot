services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/aegis.sqlite3
      LOG_FILE: /app/logs/aegis.log
      CONFIG_PATH: /app/config.yaml
    volumes:
      - aegis-data:/app/data
      - aegis-logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  aegis-data:
  aegis-logs:
