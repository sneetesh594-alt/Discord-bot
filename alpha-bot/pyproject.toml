[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aegis-discord-moderator"
version = "1.2.0"
description = "Discord moderation with local rules, human-reviewed AI signals, and appeals"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.6,<3", "aiosqlite>=0.21,<1",
  "python-dotenv>=1.1,<2", "PyYAML>=6.0.2,<7", "openai>=2,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
aegis = "aegis.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
